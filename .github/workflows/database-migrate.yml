name: Apply Neon database migrations

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Select APPLY only after reviewing the committed migration SQL and intending to change Cogniva's Neon production database."
        required: true
        type: choice
        options:
          - "NO"
          - "APPLY"
        default: "NO"

permissions:
  contents: read

concurrency:
  group: cogniva-neon-production-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Require explicit production confirmation
        env:
          CONFIRM_PRODUCTION: ${{ github.event.inputs.confirm_production }}
        shell: bash
        run: |
          if [[ "$CONFIRM_PRODUCTION" != "APPLY" ]]; then
            echo "::error::Production migration not confirmed. Select APPLY only after reviewing the committed migration SQL."
            exit 1
          fi

      - name: Check out main
        uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.21.0
          run_install: false

      - name: Confirm migration credential is configured
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
        run: |
          if [ -z "$DATABASE_MIGRATION_URL" ]; then
            echo "::error::Add DATABASE_MIGRATION_URL under repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Apply committed pending migrations to Neon
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
        run: pnpm db:migrate
