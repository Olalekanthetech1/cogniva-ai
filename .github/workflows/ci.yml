name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.21.0
          run_install: false

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --no-frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Export resolved lockfile for dependency refresh
        if: github.event_name == 'pull_request'
        run: |
          split -b 4000 -d -a 3 pnpm-lock.yaml /tmp/cogniva-lock-
          for file in /tmp/cogniva-lock-*; do
            printf 'LOCKFILE_CHUNK_%s=' "${file##*-}"
            base64 --wrap=0 "$file"
            printf '\n'
          done

      - name: Tutor intelligence regression tests
        run: pnpm test:tutor-intelligence

      - name: Tutor Markdown rendering regression tests
        run: pnpm test:tutor-markdown

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Production build
        run: pnpm build
