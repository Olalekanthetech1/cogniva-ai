name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cogniva_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cogniva_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cogniva_test
      DATABASE_MIGRATION_URL: postgresql://postgres:postgres@127.0.0.1:5432/cogniva_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.21.0
          run_install: false

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Apply migrations to isolated integration-test database
        run: pnpm db:migrate

      - name: Authentication and student-profile integration tests
        run: pnpm test:auth-lifecycle

      - name: Tutor intelligence regression tests
        run: pnpm test:tutor-intelligence

      - name: Tutor learning framework regression tests
        run: pnpm test:tutor-learning-framework

      - name: Tutor Markdown rendering regression tests
        run: pnpm test:tutor-markdown

      - name: Learning plan output validation tests
        run: pnpm test:learning-plan-output

      - name: Learning plan review input tests
        run: pnpm test:learning-plan-review

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Production build
        run: pnpm build
