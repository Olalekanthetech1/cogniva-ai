name: Generate Neon database migrations

on:
  workflow_dispatch:
    inputs:
      confirm_generation:
        description: "Select GENERATE to create and commit migration SQL from the schema on main. This workflow does not connect to Neon."
        required: true
        type: choice
        options:
          - "NO"
          - "GENERATE"
        default: "NO"

permissions:
  contents: write

concurrency:
  group: cogniva-neon-schema-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Require explicit generation confirmation
        env:
          CONFIRM_GENERATION: ${{ github.event.inputs.confirm_generation }}
        shell: bash
        run: |
          if [[ "$CONFIRM_GENERATION" != "GENERATE" ]]; then
            echo "::error::Migration generation not confirmed. Select GENERATE to create migration files without applying them."
            exit 1
          fi

      - name: Check out main
        uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.21.0
          run_install: false

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate SQL and Drizzle migration history
        run: pnpm db:generate

      - name: Commit generated migration files
        run: |
          git add pnpm-lock.yaml packages/database/migrations
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(database): generate Neon schema migration"
            git push origin HEAD:main
          else
            echo "No schema changes detected; no migration was generated."
          fi
